services:
  # ── Backend API (Node.js) ────────────────────────────────────────────────────
  - type: web
    name: imovies-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    region: singapore
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://imovies-client.onrender.com
      - key: NODE_ENV
        value: production
      - key: SEAT_HOLD_MINUTES
        value: 5

  # ── Frontend (Vite static site) ──────────────────────────────────────────────
  - type: web
    name: imovies-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://imovies-serverr.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
